<div class="list">
  {% for p in places %}
  <div class="list-row">
    <span class="grow">{{ p.name }}{% if p.isHome %} <span class="chip chip-ok">Home</span>{% endif %}<div class="hint">{{ p.address }}</div></span>
    <form hx-post="/places/{{ p.id }}/delete" hx-target="#places-list" hx-swap="innerHTML" style="margin:0;">
      <button class="btn btn-sm btn-ghost btn-danger" type="submit">Remove</button>
    </form>
  </div>
  {% else %}
  <div class="list-row muted">No places yet.</div>
  {% endfor %}
</div>
